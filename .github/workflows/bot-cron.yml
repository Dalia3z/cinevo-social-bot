# ============================================================================
# Cinevo AI Social Media Engagement Bot - Scheduled GitHub Action
# ============================================================================
# Runs the bot on a schedule (cron) inside GitHub Actions.
#
# IMPORTANT (SECURITY):
#   - NO real secrets are stored in this file.
#   - All API keys/tokens are read from GitHub *repository secrets* at runtime
#     via the `env:` block below (e.g. ${{ secrets.DEEPSEEK_API_KEY }}).
#   - To configure, add each secret in:
#       GitHub repo -> Settings -> Secrets and variables -> Actions
#     using the exact names listed in the `env:` block.
#
# How it works:
#   - `python main.py --once` processes ONE full cycle across all enabled
#     platforms and then exits (ideal for cron).
#   - The SQLite database (bot_state.db) is restored from the GitHub Actions
#     cache before running and saved back afterwards, so the bot remembers
#     which comments it already replied to and never double-posts.
# ============================================================================

name: Cinevo Bot (scheduled)

# ---------------------------------------------------------------------------
# IMPORTANT: GitHub disables `schedule` triggers automatically after 60 days
# of repository inactivity. If the bot "stops running", re-enable the workflow
# from the Actions tab (or push any commit) and it will resume.
# Also note: GitHub's cron is best-effort and can be delayed by 5-30+ minutes,
# and high-frequency schedules (every 30 min) are frequently SKIPPED.
# ---------------------------------------------------------------------------
on:
  schedule:
    # Cron uses UTC. Runs every 30 minutes by default.
    # Adjust to your needs, e.g. every 15 min:  "*/15 * * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allows manual trigger from the Actions tab.

# Allow the workflow to write back the updated DB cache and (optionally) commit.
permissions:
  contents: read

jobs:
  run-bot:
    name: Run bot (single cycle)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Restore the SQLite "already replied" state so we don't double-post.
      # The cache key is static on purpose: we always want the latest DB.
      - name: Restore bot state database from cache
        id: db-cache
        uses: actions/cache@v4
        with:
          path: bot_state.db
          key: cinevo-bot-db-v1

      # Apply safe defaults for any variable that was not set in the repo.
      # This lets the bot run even if a variable is missing, while secrets
      # (API keys) are still required from the Secrets tab.
      - name: Apply config defaults
        run: |
          # BOT_ENABLED defaults to true so the bot actually runs.
          if [ -z "${BOT_ENABLED:-}" ]; then echo "BOT_ENABLED=true" >> "$GITHUB_ENV"; fi
          # ACTIVE_PLATFORMS defaults to youtube only (change this to add more).
          if [ -z "${ACTIVE_PLATFORMS:-}" ]; then echo "ACTIVE_PLATFORMS=youtube" >> "$GITHUB_ENV"; fi
          # Platform enable flags default to false unless explicitly enabled.
          if [ -z "${YOUTUBE_ENABLED:-}" ]; then echo "YOUTUBE_ENABLED=true" >> "$GITHUB_ENV"; fi
          if [ -z "${META_ENABLED:-}" ]; then echo "META_ENABLED=false" >> "$GITHUB_ENV"; fi
          if [ -z "${TIKTOK_ENABLED:-}" ]; then echo "TIKTOK_ENABLED=false" >> "$GITHUB_ENV"; fi
          if [ -z "${QUORA_ENABLED:-}" ]; then echo "QUORA_ENABLED=false" >> "$GITHUB_ENV"; fi
        env:
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          ACTIVE_PLATFORMS: ${{ vars.ACTIVE_PLATFORMS }}
          YOUTUBE_ENABLED: ${{ vars.YOUTUBE_ENABLED }}
          META_ENABLED: ${{ vars.META_ENABLED }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED }}
          QUORA_ENABLED: ${{ vars.QUORA_ENABLED }}

      # Diagnostic step: prints the resolved (non-secret) config so we can
      # confirm GitHub is passing the variables correctly. Secrets are NOT shown.
      - name: Show resolved config (non-secret)
        run: |
          echo "BOT_ENABLED='${BOT_ENABLED}'"
          echo "ACTIVE_PLATFORMS='${ACTIVE_PLATFORMS}'"
          echo "YOUTUBE_ENABLED='${YOUTUBE_ENABLED}'"
          echo "META_ENABLED='${META_ENABLED}'"

      # Fail fast with a CLEAR message if a required secret is missing.
      # Without this, the bot silently exits and DeepSeek usage stays at 0.
      - name: Verify required secrets are present
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
        run: |
          missing=0
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY secret is MISSING. Add it in Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "${YOUTUBE_API_KEY:-}" ]; then
            echo "::error::YOUTUBE_API_KEY secret is MISSING. Add it in Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "${YOUTUBE_OAUTH_TOKEN:-}" ]; then
            echo "::warning::YOUTUBE_OAUTH_TOKEN secret is MISSING. The bot can READ comments but CANNOT POST replies."
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Aborting: required secrets are missing."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run bot (single cycle)
        env:
          # --- Master switch / platforms ---
          BOT_ENABLED: ${{ env.BOT_ENABLED }}
          ACTIVE_PLATFORMS: ${{ env.ACTIVE_PLATFORMS }}
          # --- DeepSeek AI ---
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DEEPSEEK_MAX_TOKENS: ${{ vars.DEEPSEEK_MAX_TOKENS }}
          DEEPSEEK_TEMPERATURE: ${{ vars.DEEPSEEK_TEMPERATURE }}
          # --- Brand / website ---
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          # --- YouTube ---
          YOUTUBE_ENABLED: ${{ env.YOUTUBE_ENABLED }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
          YOUTUBE_VIDEO_IDS: ${{ vars.YOUTUBE_VIDEO_IDS }}
          YOUTUBE_CHANNEL_IDS: ${{ vars.YOUTUBE_CHANNEL_IDS }}
          # --- Meta (Facebook + Instagram) ---
          META_ENABLED: ${{ env.META_ENABLED }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          FACEBOOK_PAGE_IDS: ${{ vars.FACEBOOK_PAGE_IDS }}
          INSTAGRAM_BUSINESS_IDS: ${{ vars.INSTAGRAM_BUSINESS_IDS }}
          # --- TikTok ---
          TIKTOK_ENABLED: ${{ env.TIKTOK_ENABLED }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          TIKTOK_VIDEO_IDS: ${{ vars.TIKTOK_VIDEO_IDS }}
          # --- Quora ---
          QUORA_ENABLED: ${{ env.QUORA_ENABLED }}
          QUORA_TOPICS: ${{ vars.QUORA_TOPICS }}
          QUORA_USERNAME: ${{ secrets.QUORA_USERNAME }}
          QUORA_PASSWORD: ${{ secrets.QUORA_PASSWORD }}
          # --- Behaviour / anti-ban tuning ---
          MIN_DELAY_SECONDS: ${{ vars.MIN_DELAY_SECONDS }}
          MAX_DELAY_SECONDS: ${{ vars.MAX_DELAY_SECONDS }}
          POLL_INTERVAL_SECONDS: ${{ vars.POLL_INTERVAL_SECONDS }}
          MAX_COMMENTS_PER_CYCLE: ${{ vars.MAX_COMMENTS_PER_CYCLE }}
          # --- Targets / DB / logging ---
          TARGETS_FILE: targets.json
          MAX_TARGETS_PER_PLATFORM: ${{ vars.MAX_TARGETS_PER_PLATFORM }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        run: |
          # Run exactly one cycle then exit (safe for a scheduled job).
          # `set -o pipefail` ensures a Python crash fails the step.
          set -o pipefail
          python main.py --once 2>&1 | tee bot_run.log

      # Print a short summary so we can see WHY DeepSeek usage may be 0:
      #   - "No new comments to handle"  -> nothing to reply to (targets empty)
      #   - "No AI reply generated"      -> DeepSeek call failed (bad key/quota)
      #   - "Cannot post ... OAUTH"      -> reply generated but not posted
      - name: Run summary
        if: always()
        run: |
          echo "==================== BOT RUN SUMMARY ===================="
          if [ -f bot_run.log ]; then
            echo "--- DeepSeek calls ---"
            ds_calls=$(grep -ciE "DeepSeek reply generated" bot_run.log || true)
            echo "DeepSeek replies generated: ${ds_calls}"
            grep -iE "deepseek|ai reply|generated" bot_run.log || echo "(none - DeepSeek was never called)"
            echo "--- Lines mentioning comments / items ---"
            grep -iE "new comment|new item|no new" bot_run.log || echo "(none)"
            echo "--- Replies posted ---"
            grep -iE "Replied on|Replies posted" bot_run.log || echo "(none)"
            echo "--- Errors ---"
            grep -iE "error|failed|missing|aborting" bot_run.log || echo "(none)"
          else
            echo "bot_run.log not found."
          fi
          echo "========================================================="

      # Save the updated DB so the next scheduled run knows what was replied to.
      - name: Save bot state database to cache
        if: always()
        uses: actions/cache@v4
        with:
          path: bot_state.db
          key: cinevo-bot-db-v1
