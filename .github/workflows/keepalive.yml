# ============================================================================
# Keep-alive workflow
# ============================================================================
# GitHub automatically DISABLES scheduled workflows after 60 days of
# repository inactivity. This is the #1 reason a cron bot "stops running".
#
# This workflow runs once a week and makes a tiny commit to the repository,
# which resets the 60-day inactivity timer so `bot-cron.yml` keeps firing.
#
# It is intentionally lightweight and safe (only touches a timestamp file).
# ============================================================================

name: Keep-alive (prevent cron disable)

on:
  schedule:
    # Every Sunday at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: Touch keep-alive file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update keep-alive timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          echo "Updated .github/keepalive.txt"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: keep-alive to prevent scheduled workflow disable"
            git push
          fi
